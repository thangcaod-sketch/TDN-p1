<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ôn thi lớp 6 CLC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>



:root{
  --bg:#fafaf7; --surface:#ffffff; --ink:#1a2330; --ink-soft:#5b6677; --ink-mute:#9aa3b1;
  --line:#e8eaee; --line-strong:#d2d7de;
  --brand:#2e9cca; --brand-deep:#1f6e8c; --brand-soft:#e7f5fb;
  --good:#1a8f55; --good-soft:#e3f5ec; --good-deep:#14704a;
  --warn:#c94843; --warn-soft:#fbe9e8; --warn-deep:#a33b37;
  --gold:#cc9500; --gold-soft:#fdf5e0;
  --purple:#7c5cbf; --purple-soft:#ece5f7;
  --shadow-sm:0 1px 2px rgba(20,30,50,.04),0 2px 4px rgba(20,30,50,.04);
  --shadow:0 4px 12px rgba(20,30,50,.06),0 12px 32px rgba(20,30,50,.06);
  --r:14px; --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro','Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:'Bricolage Grotesque','Be Vietnam Pro',sans-serif;font-weight:700;letter-spacing:-.01em;line-height:1.25}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}

/* === Topbar === */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-family:'Bricolage Grotesque';font-weight:700;font-size:1.15rem;color:var(--brand-deep)}
.brand-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.85rem}
.hdr-pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:4px;font-weight:700;font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid transparent}
.pill-xp{background:var(--gold-soft);color:var(--gold);border-color:#f0dfa0}
.pill-streak{background:#fef3e0;color:#d48800;border-color:#f5dca0}
.pill-level{background:var(--purple-soft);color:var(--purple);border-color:#d9cce8}
.back-link{font-size:.88rem;font-weight:600;color:var(--ink-mute);cursor:pointer}

.container{max-width:720px;margin:0 auto;padding:20px}
main{padding-bottom:32px}

/* === Buttons === */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:12px;font-weight:600;font-size:.93rem;transition:transform .1s,box-shadow .15s,background .15s;box-shadow:var(--shadow-sm)}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-good{background:var(--good);color:#fff}
.btn-ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line-strong);box-shadow:none}
.btn-ghost:hover{background:var(--surface);color:var(--ink)}
.btn-block{width:100%}

/* === Cards === */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .15s,border-color .15s}
.card.lift{cursor:pointer}
.card.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand)}

/* === Overview === */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
@media(max-width:560px){.ov-grid{grid-template-columns:1fr}}
.ov-label{font-size:.75rem;font-weight:600;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em}
.ov-value{font-family:'Bricolage Grotesque';font-size:1.7rem;font-weight:700;line-height:1.1;margin:4px 0 2px}
.ov-sub{font-size:.82rem;font-weight:600}

/* === Subject grid === */
.subject-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(max-width:560px){.subject-grid{grid-template-columns:1fr}}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sc-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.sc-title{font-family:'Bricolage Grotesque';font-size:.97rem;font-weight:700}
.sc-meta{font-size:.8rem;color:var(--ink-mute);font-weight:500}
.sc-bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.sc-fill{height:100%;border-radius:99px;transition:width .4s}
.section-title{font-family:'Bricolage Grotesque';font-size:1.15rem;font-weight:700;margin:22px 0 12px;color:var(--ink)}

/* === Actions === */
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
@media(max-width:560px){.action-grid{grid-template-columns:1fr}}
.action-card{display:flex;align-items:center;gap:12px;padding:16px}
.action-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.action-title{font-weight:700;font-size:.93rem}
.action-sub{font-size:.8rem;color:var(--ink-mute);font-weight:500}

/* === Subject header === */
.subject-header{padding:24px;border-radius:var(--r-lg);margin-bottom:20px}
.sh-title{font-family:'Bricolage Grotesque';font-size:1.5rem;font-weight:700;margin-bottom:6px}
.sh-stats{display:flex;gap:14px;font-size:.88rem;font-weight:500;color:var(--ink-soft);flex-wrap:wrap}
.sh-stats b{font-weight:700;color:var(--ink)}

/* === Mode grid === */
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr}}
.mode-card{padding:20px}
.mode-title{font-family:'Bricolage Grotesque';font-size:1.02rem;font-weight:700;margin-bottom:2px}
.mode-desc{font-size:.84rem;color:var(--ink-mute);line-height:1.4;margin-bottom:14px;min-height:36px}
.mode-badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:6px;display:inline-block}
.mode-btn{width:100%;padding:12px;border-radius:10px;font-size:.93rem;font-weight:600;color:#fff;transition:background .15s}
.mode-btn:hover{filter:brightness(.92)}

/* === Ring === */
.ring{position:relative}.ring svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:4}
.ring-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:700;font-size:.78rem;color:var(--ink-soft)}

/* ========== QUIZ ========== */
.quiz-header{
  position:sticky;top:0;z-index:10;
  background:rgba(250,250,247,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:12px 20px;display:flex;align-items:center;gap:14px;
}
.quiz-progress{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.quiz-pbar{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-deep));transition:width .3s;border-radius:99px}
.quiz-counter{font-family:'Bricolage Grotesque';font-weight:700;color:var(--ink-mute);font-size:.88rem;min-width:50px;text-align:right}
.quiz-counter strong{color:var(--ink)}
.quiz-close{font-size:1.1rem;color:var(--ink-mute);padding:4px}

.quiz-body{padding:28px 20px 150px;max-width:680px;margin:0 auto}

.q-meta{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.q-pill{font-family:'Bricolage Grotesque';font-weight:700;font-size:.75rem;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.q-pill-id{background:var(--ink);color:#fff}
.q-pill-trap{background:var(--gold-soft);color:var(--gold)}
.q-pill-streak{background:#fef3e0;color:#d48800}

.q-text{
  font-family:'Bricolage Grotesque';font-size:1.4rem;font-weight:500;line-height:1.55;
  color:var(--ink);margin-bottom:28px;white-space:pre-line;
}
.q-image{margin-bottom:16px;max-width:100%;border-radius:12px;border:1px solid var(--line)}
.q-img-desc{margin-bottom:16px;padding:10px 14px;border-radius:10px;font-size:.84rem;font-style:italic;background:var(--brand-soft);color:var(--brand-deep);border-left:3px solid var(--brand)}
.q-search{display:inline-flex;align-items:center;gap:5px;margin-bottom:22px;padding:5px 12px;border:1px solid var(--line-strong);border-radius:99px;font-size:.8rem;font-weight:600;color:var(--ink-mute);text-decoration:none;transition:all .15s}
.q-search:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}

/* === Options === */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:14px;padding:16px 20px;
  background:var(--surface);border:2px solid var(--line);border-radius:var(--r);
  cursor:pointer;text-align:left;font-size:1.02rem;
  transition:all .12s ease;width:100%;
}
.opt:hover:not(:disabled):not(.correct):not(.wrong):not(.dim){border-color:var(--brand);background:var(--brand-soft);transform:translateX(3px)}
.opt.selected{border-color:var(--brand);background:var(--brand-soft);font-weight:600}
.opt.correct{border-color:var(--good);background:var(--good-soft);border-left-width:5px}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft);border-left-width:5px}
.opt.dim{opacity:.35;pointer-events:none}
.opt-key{
  width:32px;height:32px;border-radius:8px;background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bricolage Grotesque';font-weight:700;color:var(--ink-soft);
  flex-shrink:0;border:1.5px solid var(--line-strong);font-size:.9rem;
}
.opt.selected .opt-key{background:var(--brand);color:#fff;border-color:var(--brand)}
.opt.correct .opt-key{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong .opt-key{background:var(--warn);color:#fff;border-color:var(--warn)}
.opt-text{flex:1;line-height:1.45;font-weight:500}
.opt.selected .opt-text{color:var(--brand-deep)}
.opt.correct .opt-text{color:var(--good-deep);font-weight:600}
.opt.wrong .opt-text{color:var(--warn-deep)}
.opt-note{font-size:.82rem;font-style:italic;color:var(--ink-mute);margin-top:2px}
.opt-mark{font-weight:700;font-size:1.1rem;flex-shrink:0}

/* === Quiz footer === */
.quiz-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  padding:16px 20px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  transition:background .25s,border-color .25s;
}
.quiz-footer.neutral{background:var(--surface);border-top:1px solid var(--line)}
.quiz-footer.correct-fb{background:var(--good-soft);border-top:3px solid var(--good)}
.quiz-footer.wrong-fb{background:var(--warn-soft);border-top:3px solid var(--warn)}
.qf-inner{max-width:680px;margin:0 auto}
.qf-feedback{margin-bottom:10px}
.qf-title{font-family:'Bricolage Grotesque';font-size:1.05rem;font-weight:700}
.correct-fb .qf-title{color:var(--good-deep)}
.wrong-fb .qf-title{color:var(--warn-deep)}
.qf-sub{font-size:.88rem;margin-top:2px}
.correct-fb .qf-sub{color:var(--good)}
.wrong-fb .qf-sub{color:var(--warn-deep)}
.qf-bonus{font-size:.82rem;font-weight:600;margin-top:4px;color:var(--ink-soft)}
.qf-actions{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qf-info{font-size:.82rem;color:var(--ink-mute)}
.btn-check{padding:13px 32px;border-radius:12px;font-weight:700;font-size:.93rem;color:#fff;transition:all .15s;box-shadow:var(--shadow-sm)}
.btn-check:hover:not(:disabled){box-shadow:var(--shadow);transform:translateY(-1px)}
.btn-check.active{background:var(--brand)}
.btn-check.active:hover{background:var(--brand-deep)}
.btn-check.disabled-look{background:var(--line);color:var(--ink-mute);cursor:not-allowed;box-shadow:none}
.btn-check.good-btn{background:var(--good);color:#fff}
.btn-check.good-btn:hover{background:var(--good-deep)}
.btn-check.warn-btn{background:var(--warn);color:#fff}
.btn-check.warn-btn:hover{background:var(--warn-deep)}

/* === Toast / Combo / Confetti === */
.mystery-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--purple);color:#fff;padding:12px 20px;border-radius:14px;font-size:.88rem;font-weight:600;z-index:100;box-shadow:var(--shadow);animation:toastIn .4s ease,toastOut .4s ease 2.6s forwards;max-width:340px;text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-16px)}}
.combo-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-family:'Bricolage Grotesque';font-size:1.5rem;font-weight:800;z-index:100;text-align:center;pointer-events:none;animation:comboPop .8s ease forwards}
@keyframes comboPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}30%{transform:translate(-50%,-50%) scale(1.15);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.confetti-box{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:200;overflow:hidden}
.confetti-p{position:absolute;width:10px;height:10px;border-radius:2px;animation:cfall 2.5s ease-out forwards}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* === Result === */
.result-hero{text-align:center;padding:28px 24px;margin-bottom:24px;background:linear-gradient(135deg,var(--surface) 0%,var(--brand-soft) 100%);border-radius:var(--r-lg);border:1px solid var(--line)}
.result-score{font-family:'Bricolage Grotesque';font-size:2.8rem;font-weight:800;line-height:1}
.result-verdict{font-family:'Bricolage Grotesque';font-size:1.2rem;font-weight:700;margin-top:4px}
.result-sub{font-size:.88rem;color:var(--ink-mute);margin-top:4px}
.detail-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.detail-icon{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;flex-shrink:0;color:#fff}

/* === Boss === */
.boss-stage{text-align:center;padding:20px 0}
.boss-num{font-family:'Bricolage Grotesque';font-size:3.5rem;font-weight:800;line-height:1}
.boss-label{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-mute);margin-top:4px}
.boss-hearts{display:flex;justify-content:center;gap:6px;margin-top:10px;font-size:1.2rem}
.boss-heart-lost{opacity:.2}

/* === Level card === */
.level-card{padding:20px;margin-bottom:16px;text-align:center;border:1px solid var(--brand);background:var(--brand-soft)}
.lvl-emoji{font-size:1.8rem}
.lvl-name{font-family:'Bricolage Grotesque';font-size:1.1rem;font-weight:700;color:var(--brand-deep);margin:4px 0}
.lvl-xp{font-size:.84rem;color:var(--ink-mute);font-weight:600}
.lvl-bar{height:6px;background:rgba(0,0,0,.08);border-radius:99px;margin-top:8px;overflow:hidden}
.lvl-bar-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .4s}

/* === Resume banner === */
.resume-banner{background:var(--gold-soft);border:1px solid #e8d5a0;border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.resume-banner p{flex:1;font-weight:600;font-size:.88rem;color:#946600}

/* === Lists === */
.list-row{padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;display:flex;gap:10px;align-items:flex-start}
.lr-meta{font-size:.75rem;color:var(--ink-mute);font-weight:600;margin-bottom:2px}
.lr-q{font-size:.88rem;font-weight:500;line-height:1.4}

/* === Flashcard === */
.fc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(max-width:560px){.fc-grid{grid-template-columns:1fr}}
.fc-topic-title{font-family:'Bricolage Grotesque';font-size:.97rem;font-weight:700}
.fc-topic-meta{font-size:.8rem;color:var(--ink-mute);margin-top:2px}
.fc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:44px 24px;text-align:center;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;box-shadow:var(--shadow-sm);margin:16px 0}
.fc-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.fc-front{font-family:'Bricolage Grotesque';font-size:1.6rem;font-weight:700}
.fc-back{font-family:'Bricolage Grotesque';font-size:1.3rem;font-weight:600;color:var(--brand-deep)}
.fc-hint{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-mute);margin-top:12px}
.fc-rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.fc-rate-btn{padding:10px 6px;border-radius:10px;font-size:.84rem;font-weight:600;border:1.5px solid var(--line-strong);transition:all .12s}
.fc-rate-btn:hover{border-color:var(--brand);background:var(--brand-soft)}

/* === Modal === */
.modal-overlay{position:fixed;inset:0;background:rgba(26,35,48,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow)}
.modal h3{font-family:'Bricolage Grotesque';font-size:1.15rem;margin-bottom:6px}
.modal p{color:var(--ink-soft);font-size:.88rem;margin-bottom:16px;line-height:1.4}
.boss-cfg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.boss-opt{padding:12px 6px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line-strong);font-family:'Bricolage Grotesque';font-size:1.2rem;font-weight:700;text-align:center;transition:all .12s}
.boss-opt.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.boss-opt-label{display:block;font-size:.68rem;font-weight:600;text-transform:uppercase;color:var(--ink-mute);margin-top:2px;font-family:'Be Vietnam Pro'}
.boss-opt.active .boss-opt-label{color:var(--brand-deep)}

/* === Utilities === */
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.empty-state{text-align:center;padding:48px 0}
.empty-state h3{font-family:'Bricolage Grotesque';font-size:1.2rem;margin-bottom:8px}
.empty-state p{color:var(--ink-mute);margin-bottom:16px}

@media(max-width:600px){
  .container{padding:14px}
  .q-text{font-size:1.18rem}
  .opt{padding:14px 16px;font-size:.95rem}
  .opt-key{width:28px;height:28px;font-size:.82rem}
  .quiz-body{padding:22px 14px 150px}
  .quiz-header{padding:10px 14px;gap:10px}
  .quiz-footer{padding:14px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
  .topbar{padding:10px 14px}
  .hdr-pills{gap:4px}
  .pill{font-size:.7rem;padding:3px 7px}
  .subject-grid,.mode-grid{gap:8px}
  .action-grid{gap:8px}
  .btn-check{padding:12px 24px;font-size:.88rem}
}



/* === Homework Card === */
.hw-card{background:var(--surface);border:2px solid var(--brand);border-radius:var(--r-lg);padding:22px;margin-bottom:20px;box-shadow:0 2px 8px rgba(46,156,202,.1)}
.hw-card.done{border-color:var(--good)}
.hw-eyebrow{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--brand-deep);margin-bottom:6px}
.hw-title{font-family:'Bricolage Grotesque';font-size:1.2rem;font-weight:700;margin-bottom:4px}
.hw-meta{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px;line-height:1.4}
.hw-score{font-family:'Bricolage Grotesque';font-size:2rem;font-weight:800;margin-bottom:2px}
.hw-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.hw-wrong-item{padding:8px 0;border-bottom:1px solid var(--line);font-size:.86rem;line-height:1.45}

/* === Export === */
.export-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:10px;font-weight:600;font-size:.88rem;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--ink-soft);transition:all .15s;cursor:pointer}
.export-btn:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.export-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-size:.88rem;font-weight:600;z-index:200;animation:toastIn .3s ease,toastOut .3s ease 2s forwards}

/* === XP Float Animation === */
.xp-float{position:fixed;z-index:100;font-family:'Bricolage Grotesque';font-weight:800;font-size:1rem;pointer-events:none;animation:xpUp 1.2s ease forwards}
@keyframes xpUp{0%{opacity:1;transform:translateY(0)}50%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}

/* === Result XP Section === */
.xp-summary{background:var(--gold-soft);border:1px solid #e8d5a0;border-radius:var(--r);padding:16px;margin-bottom:16px}

.level-progress-card{background:var(--purple-soft);border:1px solid #d5c8e8;border-radius:var(--r);padding:16px;margin-bottom:16px;text-align:center}
.lp-before-after{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;font-size:.88rem}
.lp-emoji{font-size:1.3rem}
.lp-name{font-family:'Bricolage Grotesque';font-weight:700;color:var(--purple)}
.lp-arrow{color:var(--ink-mute)}

.srs-meta{font-size:.82rem;color:var(--ink-mute);font-weight:500}
.srs-arrow{font-size:1.1rem;color:var(--ink-mute)}
.srs-card.empty{opacity:.5;cursor:default}
.srs-card.empty:hover{border-color:var(--line);box-shadow:none}

.rpt-score-box{background:linear-gradient(135deg,#e7f5fb,#fff);border:1.5px solid #2e9cca;border-radius:14px;padding:16px;text-align:center;margin-bottom:16px}

.rpt-score-pct{font-size:1rem;font-weight:600;color:#5b6677}
.rpt-score-meta{font-size:.82rem;color:#9aa3b1;margin-top:4px}
.rpt-section{margin-bottom:12px}
.rpt-section-title{font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#d9534f;margin-bottom:8px}

.rpt-wrong-cor{color:#0d8a4d}
.rpt-footer{text-align:center;padding-top:12px;border-top:1.5px solid #e8eaee;font-size:.72rem;color:#9aa3b1;margin-top:12px}

ography","q":"Nguyễn Trường Tộ was known for his intelligence and diligence, earning him the nickname “Trạng Tộ”. With the desire to strengthen the country, he sent many petitions suggesting reforms. Which of the following is included in his proposals?","c":"D","o":[["A","Expanding diplomatic relations"],["B","Sending people to study Western technology"],["C","Opening schools for shipbuilding and gun manufacturing"],["D","All of the above"]]},{"id":"q0143","e":9,"eq":1,"s":"science","q":"What is the main function of flowers?","c":"C","o":[["A","To protect the seeds and help with seed dispersal"],["B","To produce new plants"],["C","To be the reproductive organ and produce seeds"],["D","To make food for the plants"]]},{"id":"q0144","e":9,"eq":2,"s":"life-skills","q":"Which is NOT a natural way of pollination?","c":"C","o":[["A","Insect pollination"],["B","Self-pollination"],["C","Hand-pollination"],["D","Wind pollination"]]},{"id":"q0145","e":9,"eq":3,"s":"science","q":"Which of the following plants can grow from its stems?","c":"D","o":[["A","Potato"],["B","Rose"],["C","Bamboo"],["D","All of the above"]]},{"id":"q0146","e":9,"eq":4,"s":"life-skills","q":"In which part of the flower is pollen stored?","c":"A","o":[["A","Anther"],["B","Ovary"],["C","Filament"],["D","Petal"]]},{"id":"q0147","e":9,"eq":5,"s":"life-skills","q":"Which of the following is the female part of a flower?","c":"B","o":[["A","Petal"],["B","Ovary"],["C","Sepal"],["D","Stamen"]]},{"id":"q0148","e":9,"eq":6,"s":"science","q":"If a flower's ovary turns into a fruit, what process has just occurred?","c":"C","o":[["A","Pollination"],["B","Germination"],["C","Fertilization"],["D","Seed dispersal"]]},{"id":"q0149","e":9,"eq":7,"s":"life-skills","q":"The diagram shows the parts of a flower. Where must pollen land to pollinate the flower?","c":"D","o":[["A","Anther"],["B","Ovule"],["C","Ovary"],["D","Stigma"]]},{"id":"q0150","e":9,"eq":8,"s":"science","q":"Why is seed dispersal important for plant survival "img":"Bốn hình thực phẩm gồm: A. Cheese, B. Bread, C. Flan, D. Yogurt"},{"id":"q0182","e":11,"eq":6,"s":"science","q":"Read the process for making white bean sprouts (giá đỗ màu trắng) and answer the question below. Step 1. Wash the beans and put them in water overnight (about 8 hours). Step 2. Wash the beans again after they have been in the water. Step 3. Put the beans in a jar. You can put the lid on the jar, or you can cover the top with a cloth. But make sure air can still go inside the jar. Step 4. Put the jar in a dark place. Step 5. Every night, take the beans out and wash them again. Then, put them back in the dark place. Step 6. After a few days, the beans will start to grow. They will become white bean sprouts. After the process, the white bean sprouts have white stems and yellow leaves. Why do they have those features?","c":"B","o":[["A","The beans are washed carefully."],["B","The beans are planted in a dark place."],["C","The beans are not applied any fertilizers."],["D","The beans are put in water overnight."]]},{"id":"q0183","e":11,"eq":7,"s":"geography","q":"Which of the following locations is NOT located in the Central Coast?","c":"D","o":[["A","Truong Son Mountain Range"],["B","Bach Ma Mountain Range"],["C","Hai Van Pass"],["D","Hoang Lien Son Mountain Range"]]},{"id":"q0184","e":11,"eq":8,"s":"geography","q":"Which of the following statements best explains why Antarctica (the Antarctic continent) has almost no human population despite its large size?","c":"B","o":[["A","It is too far from other continents, making travel impossible."],["B","The harsh climate with extreme cold and strong winds makes it a difficult place for people to live."],["C","The land is covered by deserts with no access to fresh water."],["D","It is too small to support a significant human population."]]},{"id":"q0185","e":11,"eq":9,"s":"history","q":"The photo below shows people lining up to buy fuel. Which period in Vietnam's history is this photo associated with?","c":"C","o":[["A","French Colonial Period (1858 – 1945)."],["B","War Against America Period (1954 – 1975)."],["C","Subsidy Period (1976 – 1986)."],["D","Đổi Mới Period (1986 – present)."]],"img":"Hình người dân xếp hàng dài trước cửa hàng “Lương dầu đốt số 12” để mua nhiên liệu trong thời bao cấp."},{"id":"q0186","e":11,"eq":10,"s":"math","q":"On Old McDonald's farm, 5 chickens eat 600 g of food each day. How much food is needed to feed 40 chickens in 10 days?","c":"D","o":[["A","42 000 g"],["B","36 000 g"],["C","24 000 g"],["D","48 000 g"]]},{"id":"q0187","e":11,"eq":11,"s":"math","q":"A bottle of oil was full at first. After Linh used 700 ml of oil from the bottle for cooking, it became 5/12 full. If the bottle is full of oil, how much oil does it hold?","c":"A","o":[["A","1200 ml"],["B","500 ml"],["C","1680 ml"],["D","720 ml"]]},{"id":"q0188","e":12,"eq":1,"s":"science","q":"Which of the following animals gives birth to live young instead of laying eggs?","c":"B","o":[["A","Hình con cá."],["B","Hình cá voi/cá heo đen trắng."],["C","Hình một loài cá."],["D","Hình con ếch."]]},{"id":"q0189","e":12,"eq":2,"s":"science","q":"Which material is both a good conductor of heat and electricity?","c":"C","o":[["A","Wood"],["B","Rubber"],["C","Copper"],["D","Glass"]]},{"id":"q0192","e":12,"eq":5,"s":"science","q":"What is the correct order of steps in making pickled mustard greens?","c":"C","o":[["A","(a) - (b) - (c) - (d)"],["B","(a) - (d) - (b) - (c)"],["C","(b) - (d) - (c) - (a)"],["D","(b) - (d) - (a) - (c)"]],"img":"Hình hai hũ dưa cải muối, bên trong có rau cải được ngâm trong nước muối."},{"id":"q0193","e":12,"eq":6,"s":"science","q":"Nancy did an experiment to see how different liquids affect eggshells. She used: three eggshell pieces (labeled 1, 2, and 3), two glass cups (A and B), a tray, vinegar and water.","c":"A","o":[["A","Eggshell 1, because vinegar made bubbles and softened the shell."],["B","Eggshell 2, because water soaked in and changed how it felt."],["C","Eggshell 3, because air made it look different."],["D","Eggshells 1 and 2, because both were in liquid and felt softer."]],"img":"Có hai cốc thủy tinh bên cốc A và B. Vỏ trứng số 1 nằm trong cốc A, vỏ trứng số 2 nằm trong cốc B, vỏ trứng số 3 đặt trên khay bên ngoài. Cốc A có giấm, cốc B có nước."},{"id":"q0194","e":12,"eq":7,"s":"geography","q":"This is the largest island in Vietnam. In 2021, this island became the first island city and is known as the \"Đảo Ngọc\" due to its many tourist attractions. What is the name of this island?","c":"C","o":[["A","Cát Bà"],["B","Cát Bầu"],["C","Phú Quốc"],["D","Phú Quý"]],"img":"Hình một hòn đảo du lịch có bờ biển cong, nước biển và núi rừng bao quanh."},{"id":"q0195","e":12,"eq":8,"s":"geography","q":"The image shows the three-border marker, jointly built by Vietnam, Laos, and Cambodia on a mountain peak 1,086 meters above sea level. This place marks both the starting point of the Vietnam-Cambodia border and the ending point of the Vietnam-Laos border. In which province is this three-border area located?","c":"D","o":[["A","Gia Lai"],["B","Lâm Đồng"],["C","Đắc Nông"],["D","Kon Tum"]],"img":"Hình cột mốc ba biên giới Việt Nam - Lào - Campuchia đặt trên đỉnh núi, phía sau là cảnh núi rừng."},{"id":"q0196","e":12,"eq":9,"s":"geography","q":"Arrange the world's oceans in order from largest to smallest: Pacific Ocean → (a) → (b) → (c) → Southern Ocean","c":"A","o":[["A","(a) Atlantic Ocean, (b) Indian Ocean, (c) Arctic Ocean"],["B","(a) Indian Ocean, (b) Atlantic Ocean, (c) Arctic Ocean"],["C","(a) Atlantic Ocean, (b) Southern Ocean, (c) Indian Ocean"],["D","(a) Indian Ocean, (b) Arctic Ocean, (c) Atlantic Ocean"]]},{"id":"q0197","e":12,"eq":10,"s":"history","q":"During the Tran Dynasty, a boy was famous for his intelligence. At the age of 13, he passed the royal examination and became the youngest \"Trạng Nguyên\" (first-place scholar) in Vietnam's history. When a Yuan Dynasty envoy challenged the Vietnamese court with a puzzle about threading a string through a spiral shell, the boy quickly solved it with a clever trick: \"Tích tịch tình tang Bắt con kiến vàng buộc chỉ ngang lưng Bên thì lấy giấy mà bưng Bên thì bôi mỡ kiến mừng kiến sang\" (Theo Mai Hồng, Các trạng nguyên nước ta, NXB Giáo dục, 1989) Who is this historical figure?","c":"B","o":[["A","Lê Quý Đôn"],["B","Nguyễn Hiền"],["C","Trần Quốc Tuấn"],["D","Mạc Đĩnh Chi"]]},{"id":"q0198","e":12,"eq":11,"s":"math","q":"Minh follows the instructions to finish the process below.","c":"C","o":[["A","125"],["B","134"],["C","670"],["D","170"]],"img":"Bắt đầu với số 16 → cộng 9 → nhân với 5 → kiểm tra \"divisible by 2?\". Nếu chia hết cho 2 thì kết thúc; nếu không chia hết cho 2 thì quay lại bước cộng 9 và tiếp tục quy trình."},{"id":"q0199","e":12,"eq":12,"s":"math","q":"Wesley is 15 years old and his sister, Brenda, is 7. In how many years will the sum of their ages be double what it is now?","c":"D","o":[["A","15 years"],["B","7 years"],["C","22 years"],["D","11 years"]]},{"id":"q0200","e":12,"eq":13,"s":"math","q":"In a Maths Competition, Khanh had to answer 30 questions. She earned 4 points for each correct answer and lost 1 point for each incorrect answer, while she had no points for each unanswered question. Given that she did not answer 5 questions and finished with a total score of 85 points, how many of her answers were incorrect?","c":"B","o":[["A","2"],["B","3"],["C","4"],["D","5"]]},{"id":"q0203","e":12,"eq":16,"s":"english","q":"Choose the best response to fill in the blank. Sarah: I want to buy a new dress for the party. Which one do you think looks better? Emily: _______________","c":"B","o":[["A","The blue long cotton dress."],["B","The long blue cotton dress."],["C","The cotton blue long dress."],["D","The blue cotton long dress."]]},{"id":"q0204","e":12,"eq":17,"s":"english","q":"Choose the word that fits the blank to make a meaningful sentence. The museum, _______ many historical artifacts are displayed, attracts tourists from all over the world.","c":"B","o":[["A","which"],["B","where"],["C","who"],["D","when"]]},{"id":"q0205","e":12,"eq":18,"s":"vietnamese","q":"Các vế trong câu ghép sau có mối quan hệ gì? \"Phải chi tôi dành nhiều thời gian cho con Mực nhiều hơn thì nó đã không bỏ nhà ra đi.\"","c":"B","o":[["A","Nguyên nhân - kết quả"],["B","Giả thiết - kết quả"],["C","Tăng tiến"],["D","Tương phản"]]},{"id":"q0207","e":12,"eq":20,"s":"vietnamese","q":"Từ in đậm trong hai câu sau thuộc trường hợp nào sau đây? - Tôi thích thú nhìn con cá to tướng đang bị mắc kẹt trong mắt lưới. - Điều tôi tự hào nhất trên khuôn mặt mình là đôi mắt được thừa hưởng từ mẹ.","c":"B","o":[["A","Từ đồng âm"],["B","Từ nhiều nghĩa"],["C","Từ đồng nghĩa"],["D","Từ nhiều âm"]]},{"id": "q1901", "e": 19, "eq": 1, "s": "science", "q": "When a cold glass of water is left out in the air, small droplets of water appear on the outside surface of the glass. What is the correct explanation for this phenomenon?", "c": "C", "o": [["A", "Water can pass through the glass material."], ["B", "Water inside the glass evaporates and sticks to the outer surface."], ["C", "Water vapor in the air cools down and condenses into liquid on the glass surface."], ["D", "The glass is cracked, and water leaks from the inside to the outside."]], "img": "Hình ly nước lạnh, bên ngoài thành ly có các giọt nước nhỏ đọng lại."},{"id": "q1902", "e": 19, "eq": 2, "s": "science", "q": "Which of the following actions is an effective way to save electricity at home?", "c": "B", "o": [["A", "Washing clothes in the washing machine every single day."], ["B", "Replacing old light bulbs with energy-efficient LED bulbs."], ["C", "Using air conditioners at maximum power during all seasons."], ["D", "Letting the refrigerator door stay open for a long period of time."]]},{"id": "q1903", "e": 19, "eq": 3, "s": "science", "q": "Look carefully at the three groups of foods shown below. What is the main purpose of each food group for our body?", "c": "A", "o": [["A", "(1) for energy; (2) for growth; (3) for health"], ["B", "(1) for health; (2) for energy; (3) for growth"], ["C", "(1) for growth; (2) for health; (3) for energy"], ["D", "(1) for energy; (2) for health; (3) for growth"]], "img": "Ba nhóm thực phẩm: (1) Giàu tinh bột (cơm, bánh mì, khoai/ngũ cốc). (2) Giàu đạm (thịt, cá, trứng, sữa/đậu). (3) Rau củ quả cung cấp vitamin và khoáng chất."},{"id": "q1904", "e": 19, "eq": 4, "s": "science", "q": "Which tool is essential for observing and studying bacteria?", "c": "C", "o": [["A", "Hình A"], ["B", "Hình B"], ["C", "Hình C", "Kính hiển vi"], ["D", "Hình D"]], "img": "Các dụng cụ khoa học/đo lường khác nhau, trong đó có kính hiển vi (Hình C) dùng để quan sát vi khuẩn."},{"id": "q1905", "e": 19, "eq": 5, "s": "science", "q": "Look carefully at the four circuits shown below. Predict which circuit will have the brightest lamp (or lamps). Choose the best answer.", "c": "A", "o": [["A", "Hình A"], ["B", "Hình B"], ["C", "Hình C"], ["D", "Hình D"]], "img": "Bốn sơ đồ mạch điện A, B, C, D với pin và bóng đèn được mắc theo các cách khác nhau. Cần dự đoán mạch nào làm bóng đèn sáng nhất."},{"id": "q1906", "e": 19, "eq": 6, "s": "science", "q": "A scientist tested the effects of acidity on plant health by watering three groups of plants with acidic solutions of pH 2, 4, and 6. Another group was watered with neutral water (pH 7) as a control. The number of dead plants was then recorded. Based on the results, which statement best describes the relationship between acidity and plant health?", "c": "A", "o": [["A", "High acidity damages plants and causes more deaths."], ["B", "High acidity improves plant health and growth."], ["C", "Low acidity quickly kills all types of plants."], ["D", "Neutral pH causes more harm than acidic solutions."]], "img": "Bốn chậu cây được tưới bằng dung dịch có độ pH khác nhau. Kết quả: pH 2 có 10 cây chết, pH 4 có 3 cây chết, pH 6 có 1 cây chết, pH 7 có 0 cây chết."},{"id": "q1907", "e": 19, "eq": 7, "s": "history", "q": "In 2013, an ancient sundial was discovered. This sundial was a limestone disk divided into 12 sections. A hole at the center held a metal rod, and the shadow cast by this rod helped people tell the time. From which ancient civilization did this sundial originate?", "c": "B", "o": [["A", "Ancient Greece"], ["B", "Ancient Egypt"], ["C", "Ancient China"], ["D", "Ancient Rome"]], "img": "Hình một đồng hồ Mặt Trời cổ dạng đĩa đá chia thành nhiều phần, có lỗ ở giữa để cắm thanh kim loại tạo bóng."},{"id": "q1908", "e": 19, "eq": 8, "s": "history", "q": "Match the historical figures under the Tran dynasty with the correct information:\n1. Tran Quoc Tuan  2. Chu Van An  3. Pham Ngu Lao  4. Tran Quoc Toan\n(a) Gathered thousands of households, prepared weapons, trained the army, wrote on a flag \"Phá cường địch, báo hoàng ân.\"\n(b) When the country was facing invasion, he sat pondering. Soldiers accidentally stabbed his foot with a spear, he did not notice.\n(c) Used tidal currents on the Bạch Đằng River, setting spike traps to defeat the enemy.\n(d) A famous scholar, invited by the Tran king to be Principal at the Temple of Literature.", "c": "C", "o": [["A", "1-(b); 2-(c); 3-(a); 4-(d)"], ["B", "1-(c); 2-(d); 3-(a); 4-(b)"], ["C", "1-(c); 2-(d); 3-(b); 4-(a)"], ["D", "1-(b); 2-(c); 3-(d); 4-(a)"]]},{"id": "q1909", "e": 19, "eq": 9, "s": "geography", "q": "How many centrally governed cities (municipalities) are there in Vietnam today?", "c": "D", "o": [["A", "Three cities"], ["B", "Four cities"], ["C", "Five cities"], ["D", "Six cities"]]},{"id": "q1910", "e": 19, "eq": 10, "s": "history", "q": "In 1954, musician Hoàng Vân composed a song with the lyrics: \"Hò dô ta nào, kéo pháo ta vượt qua đèo... Dốc núi cao cao, nhưng lòng quyết tâm còn cao hơn núi...\" Which historical event is most closely associated with this song?", "c": "B", "o": [["A", "The August Revolution"], ["B", "The Điện Biên Phủ Campaign"], ["C", "The Hồ Chí Minh Campaign"], ["D", "The Reunification of Vietnam"]]},{"id": "q1911", "e": 19, "eq": 11, "s": "math", "q": "Observe the pattern below with Figures 1–4 made of white and grey triangles.\nRead the statements:\n1. Figure 5 has 40 grey triangles.\n2. Figure 6 has 81 white triangles.\n3. Figure 6 has a total of 364 white and grey triangles.\n4. Figure 7 has 729 more grey triangles than Figure 6.\nHow many statements are CORRECT?", "c": "B", "o": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "4"]], "img": "Có các hình Figure 1, 2, 3, 4 được tạo bởi tam giác trắng và tam giác xám. Bảng bên dưới ghi số lượng white triangles, grey triangles và total của từng figure theo quy luật tăng dần."},{"id": "q1912", "e": 19, "eq": 12, "s": "math", "q": "Choco had a square piece of paper with a perimeter of 72 cm (Figure 1). Then, he cut it into 2 identical parts and combined them into a rectangle (Figure 2). Find the perimeter of Figure 2.", "c": "D", "o": [["A", "80 cm"], ["B", "78 cm"], ["C", "76 cm"], ["D", "74 cm"]], "img": "Figure 1 là hình vuông có chu vi 72 cm. Hình vuông được cắt thành 2 phần giống nhau rồi ghép lại thành hình chữ nhật ở Figure 2."},{"id": "q1913", "e": 19, "eq": 13, "s": "math", "q": "Tuan has a box of buttons. When it is full of buttons, the mass of the box is 950 g. After Tuan gives a quarter of the buttons to his sister, the mass of the box becomes 770 g. What is the mass of the empty box?", "c": "B", "o": [["A", "230 g"], ["B", "180 g"], ["C", "350 g"], ["D", "360 g"]]},{"id": "q1914", "e": 19, "eq": 14, "s": "math", "q": "Numbers are drawn from 55 whole numbers, from 1 to 55. At least how many numbers are drawn at random to ensure that there are two numbers whose sum is 24?", "c": "D", "o": [["A", "12 numbers"], ["B", "45 numbers"], ["C", "48 numbers"], ["D", "25 numbers"]]},{"id": "q1915", "e": 19, "eq": 15, "s": "english", "q": "Which one is stressed differently from the others?", "c": "A", "o": [["A", "engineer", "trọng âm cuối"], ["B", "assistant", "trọng âm thứ hai"], ["C", "photographer", "trọng âm thứ hai"], ["D", "accountant", "trọng âm thứ hai"]]},{"id": "q1916", "e": 19, "eq": 16, "s": "english", "q": "Choose the best response to fill in the blank.\nAlex: \"Hey Anna, I think we should change to another Café. It's way too noisy and hot here!\"\nAnna: \"_________\"", "c": "D", "o": [["A", "I know this great book. Do you want to hear about it?"], ["B", "Really? Let's have a drink!"], ["C", "How do you feel about it?"], ["D", "That's a great idea! I'm sweating."]]},{"id": "q1917", "e": 19, "eq": 17, "s": "english", "q": "Read the question and choose the best option to fill in the blank.\nJohn is _______ of taking his dog for a walk every evening.", "c": "B", "o": [["A", "keen"], ["B", "fond"], ["C", "interested"], ["D", "excited"]]},{"id": "q1918", "e": 19, "eq": 18, "s": "vietnamese", "q": "Từ \"hẹp\" là một từ nhiều nghĩa. Trong câu dưới đây, nó được dùng với nghĩa chuyển. Hãy cho biết nghĩa chuyển đó là gì?\n\"Sự hiểu biết của tôi về thiên văn học còn hẹp lắm.\"", "c": "B", "o": [["A", "Có kích thước dưới mức trung bình hoặc yêu cầu, đặc biệt là về bề ngang."], ["B", "Có phạm vi bị hạn chế trong một lĩnh vực, một bộ phận nào đó."], ["C", "Không rộng rãi và độ lượng trong cách đối xử, ăn ở."], ["D", "Không rộng lượng trong cách nhìn, cách đối xử, chỉ biết có mình hoặc bộ phận của mình."]]},{"id": "q1919", "e": 19, "eq": 19, "s": "vietnamese", "q": "Trong các phương án sau, phương án nào chứa toàn những tiếng \"thành\" đồng âm với tiếng \"thành\" trong \"thành thật\"?", "c": "D", "o": [["A", "thành trì, thành quách, thành tâm."], ["B", "trung thành, thành tín, thành khẩn."], ["C", "thành công, thành niên, thành lập."], ["D", "nhiệt thành, thành kính, thành tựu."]]},{"id": "q1920", "e": 19, "eq": 20, "s": "vietnamese", "q": "Phương án nào chỉ ra điều sai về liên kết câu trong đoạn dưới đây?\n\"Trái đất là nơi con người và các động vật, thực vật sinh sống. Vì thế, chúng ta cần phải bảo vệ ngôi nhà chung này.\"", "c": "A", "o": [["A", "Các câu có mối quan hệ nguyên nhân - kết quả về mặt nội dung."], ["B", "Các câu có liên kết với nhau bằng phép thế."], ["C", "Các câu có liên kết với nhau bằng phép nối."], ["D", "Các câu có liên kết với nhau bằng phép lặp."]]},{"id": "q2101", "e": 21, "eq": 1, "s": "history", "q": "Which historical event is described in this picture?", "c": "A", "o": [["A", "The uprising led by Trưng sisters"], ["B", "The uprising led by Triệu Thị Trinh"], ["C", "The uprising led by Khúc Thừa Dụ"], ["D", "The uprising led by Ngô Quyền"]], "imgSrc": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHCAtYDASIAAhEBAxEB/8QAHQAAAAcBAQEAAAAAAAAAAAAAAgMEBQYHCAEACf/EAFMQAAEDAwMCBAQDBQUEBwQHCQECAwQABREGEiEHMRMiQVEIFGFxMoGRFSNCobEWM1LB0RckQ2I0U3KCkqLhGCXw8SZjZHN0g7LC4idERdJUk5T/xAAXAQEBAQEAAAAAAAAAAAAAAAAAAQID/8QAIxEBAQEAAwEBAAIDAQEBAAAAAAERAiExEkEDUSIyYXETQv/aAAwDAQACEQMRAD8AvBB2855rhWo+tcVz24rlTodSvnBr2/KiPauAAHJGa5kFfHFZugQUo8qpLdotvvFvctt1iIlxFjaptwZH/wA6UugbfKoZolrO/kg1BQ3UXprqfQNulah6U3i4RYYG6VbkuqVgd9yRnn3qH9Dtd6fvur1nq3cHpk1A2wZE8lxlk+o2nIBz64rWaFKSCOClQwQRnI9qh9+6Z9P7ytbk3S0Qvr5K2tyCfyBxWrgkNtvOmrghDVovlpkJR+Fph4Z/Ie1KVPfLgEYVjII7/wBaiGnOmuh9N3FFytVkEWWkbQsPLIx9irFSh4jOVHdznmsY . If the perimeter of the big rectangle is 121 cm, what is the area of that big rectangle?", "c": "C", "o": [["A", "812.5 cm²"], ["B", "162.5 cm²"], ["C", "907.5 cm²"], ["D", "181.5 cm²"]], "img": "5 hình chữ nhật giống nhau được xếp ghép thành một hình chữ nhật lớn: 3 hình nằm ngang xếp chồng, 2 hình dọc ghép bên phải."},{"id": "q1015", "e": 10, "eq": 15, "s": "english", "q": "What does the sign on the right say?", "c": "D", "o": [["A", "You must throw trash here."], ["B", "You must not throw trash here."], ["C", "You are not allowed to throw trash here."], ["D", "B and C are correct."]], "img": "Biển báo cấm vứt rác (hình người vứt rác vào thùng bị gạch chéo đỏ)."},{"id": "q1112", "e": 11, "eq": 12, "s": "math", "q": "In the multiplication table below, each number in the bolded square is the product of the two numbers at the beginning of the corresponding row and column. Observe the following multiplication table. Some information has been missing. Find the suitable number to replace the question mark (?).", "c": "A", "o": [["A", "24"], ["B", "12"], ["C", "45"], ["D", "20"]], "img": "Bảng nhân mở rộng, một số ô bị che/thiếu và có dấu hỏi (?) thay thế. Cần tìm tích phù hợp."},{"id": "q1113", "e": 11, "eq": 13, "s": "math", "q": "Find the area of the shaded rectangle.", "c": "C", "o": [["A", "36 m²"], ["B", "27 m²"], ["C", "45 m²"], ["D", "18 m²"]], "img": "Hình vẽ có một hình chữ nhật được tô đậm với các kích thước ghi trên hình. Cần tính diện tích phần tô đậm."},{"id": "q1114", "e": 11, "eq": 14, "s": "english", "q": "What does the sign on the right say?", "c": "B", "o": [["A", "You can drive as fast as you want."], ["B", "You must not drive faster than 40 km/h."], ["C", "You must not drive slower than 40 km/h."], ["D", "You can drive faster than 40 km/h."]], "img": "Biển báo giới hạn tốc độ tối đa 40 km/h (hình tròn, viền đỏ, số 40 ở giữa)."},{"id": "q1219", "e": 12, "eq": 19, "s": "vietnamese", "q": "Trong câu văn sau, dấu câu nào được dùng không chính xác?\n\"Vườn nhà tôi rộng đủ để mọi người – thí nghiệm – trồng cây này, cây nọ, kết quả là cây cối mọc lung tung.\"\n(Theo Phan Thị Vàng Anh, \"Cha tôi,\" trong Truyện ngắn, NXB Trẻ, 2025)", "c": "A", "o": [["A", "Dấu gạch ngang"], ["B", "Dấu phẩy"], ["C", "Dấu chấm"], ["D", "Không có dấu câu nào sai."]]}];

// === HOMEWORK (Phase 1: 60 câu, 3 phiên × 20) ===
function todayStr(){const d=new Date();return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});}
function todayLabel(){const d=new Date();return VDAYS[d.getDay()]+', '+d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'});}

function generateHomework(){
  const today=todayStr();
  const hw=state.progress.homework;
  if(hw&&hw.date===today&&Array.isArray(hw.sessions))return hw;
  // Generate 60 questions: SRS due + weak + fill with random
  const due=shuffle(dueQs(null)).slice(0,15);
  const usedIds=new Set(due.map(q=>q.id));
  const weak=shuffle(weakQs(null)).filter(q=>!usedIds.has(q.id)).slice(0,15);
  weak.forEach(q=>usedIds.add(q.id));
  const rest=shuffle(ableQs(null).filter(q=>!usedIds.has(q.id))).slice(0,HW_PER_DAY-due.length-weak.length);
  const all=shuffle([...due,...weak,...rest]);
  if(all.length<HW_PER_SES)return null; // not enough questions
  // Split into sessions of 20
  const sessions=[];
  for(let i=0;i<Math.ceil(all.length/HW_PER_SES);i++){
    const chunk=all.slice(i*HW_PER_SES,(i+1)*HW_PER_SES);
    if(chunk.length>0)sessions.push({idx:i,qIds:chunk.map(q=>q.id),completed:false,result:null});
  }
  const newHw={date:today,dateLabel:todayLabel(),sessions,dueCt:due.length,weakCt:weak.length};
  state.progress.homework=newHw;saveP();
  return newHw;
}

function hwTotalDone(hw){
  if(!hw||!Array.isArray(hw.sessions))return{done:0,total:0,correct:0};
  let done=0,correct=0,total=0;
  for(const s of hw.sessions){total+=s.qIds.length;if(s.completed&&s.result){done+=s.result.total;correct+=s.result.correct;}}
  return{done,total,correct};
}

function startHomeworkSession(sesIdx){
  const hw=state.progress.homework;if(!hw||!hw.sessions[sesIdx])return;
  const ses=hw.sessions[sesIdx];
  const qs=ses.qIds.map(id=>QUESTIONS.find(q=>q.id===id)).filter(Boolean);
  if(!qs.length)return;
  state.session={mode:'practice',subject:qs[0].s,questions:qs,idx:0,selected:null,revealed:false,answers:[],startTs:Date.now(),qStart:Date.now(),isTest:false,timeLeft:null,timer:null,streak:0,comebackActive:false,_lastXP:0,_lastStreak:0,_lastComeback:false,xpBefore:state.progress.gamification.xp,xpGained:0,hwSessionIdx:sesIdx};
  updateDaily();saveSession();go({name:"quiz"});
}

function exportHwReport(){
  const hw=state.progress.homework;if(!hw)return;
  const t=hwTotalDone(hw);
  let text=`📋 BÁO CÁO BÀI TẬP — ${hw.dateLabel||hw.date}\n`;
  text+=`✅ Đúng: ${t.correct}/${t.done} (${t.done>0?Math.round(t.correct/t.done*100):0}%)\n\n`;
  hw.sessions.forEach((s,i)=>{
    if(s.completed&&s.result){
      text+=`── Phiên ${i+1}: ${s.result.correct}/${s.result.total} (${Math.round(s.result.correct/s.result.total*100)}%) ──\n`;
      const wrongs=(s.result.answers||[]).filter(a=>!a.correct);
      if(wrongs.length>0){
        text+=`❌ Sai:\n`;
        wrongs.forEach(a=>{
          const q=QUESTIONS.find(x=>x.id===a.qId)||{};
          const co=q.o?q.o.find(o=>o[0]===q.c):null;
          text+=`• [Đề ${q.e||'?'} Câu ${q.eq||'?'}] ${(q.q||'').slice(0,60)}${(q.q||'').length>60?'…':''}\n`;
          text+=`  Chọn: ${a.selected} · Đáp án: ${q.c}${co?' ('+co[1]+')':''}\n`;
        });
      }
      text+='\n';
    }
  });
  text+=`— Ôn thi lớp 6 CLC`;
  doExport(text);
}
function doExport(text){if(navigator.share){navigator.share({text}).catch(()=>copyText(text));}else copyText(text);}
function copyText(text){navigator.clipboard.writeText(text).then(()=>{const t=document.createElement('div');t.className='export-toast';t.textContent='✅ Đã copy — dán vào Zalo/Messenger để gửi';document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}).catch(()=>prompt('Copy nội dung bên dưới:',text));}

}

// === SRS / STATS ===
function srsUpdate(st,ok){const s={ease:2.5,interval:0,...st};if(ok){s.ease=Math.min(3,s.ease+.05);s.interval=s.interval===0?1:(s.interval<1?1:Math.round(s.interval*s.ease));}else{s.ease=Math.max(1.3,s.ease-.25);s.interval=.25;}s.dueAt=Date.now()+s.interval*DAY;return s;}
function recordAnswer(qId,ok,ms){const c=state.progress.qStats[qId]||{seen:0,correct:0,wrong:0,totalMs:0};const s=srsUpdate(c,ok);state.progress.qStats[qId]={...c,seen:c.seen+1,correct:c.correct+(ok?1:0),wrong:c.wrong+(ok?0:1),totalMs:c.totalMs+ms,...s};saveP();}
function recordSession(ses){state.progress.history.unshift(ses);if(state.progress.history.length>30)state.progress.history.length=30;saveP();}
function ableQs(subj){return QUESTIONS.filter(q=>q.c&&(!subj||q.s===subj));}
function weakQs(subj){return ableQs(subj).filter(q=>{const s=state.progress.qStats[q.id];return s&&s.seen>=2&&s.correct/s.seen<.6;});}
function dueQs(subj){const now=Date.now();return ableQs(subj).filter(q=>{const s=state.progress.qStats[q.id];return s&&s.dueAt&&s.dueAt<=now;});}
function compStats(sk){const qs=QUESTIONS.filter(q=>q.s===sk&&q.c);let seen=0,cor=0,wr=0,mast=0,ms=0,due=0;const now=Date.now();for(const q of qs){const s=state.progress.qStats[q.id];if(!s)continue;seen++;cor+=s.correct;wr+=s.wrong;ms+=s.totalMs||0;if(s.correct>=3&&s.correct/s.seen>=.8)mast++;if(s.dueAt&&s.dueAt<=now)due++;}const t=qs.length;return{total:t,seen,correct:cor,wrong:wr,mastered:mast,accuracy:(cor+wr)>0?cor/(cor+wr):0,avgSec:(cor+wr)>0?ms/1000/(cor+wr):0,masteryPct:t>0?mast/t:0,dueNow:due};}

// === HELPERS ===
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fPct(n){return Math.round(n*100)+'%';}
function ring(pct,color,sz){const r=(sz-8)/2,c=2*Math.PI*r,o=c*(1-pct);return`<div class="ring" style="width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}"><circle class="ring-bg" cx="${sz/2}" cy="${sz/2}" r="${r}"/><circle class="ring-fg" cx="${sz/2}" cy="${sz/2}" r="${r}" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg><div class="ring-label">${Math.round(pct*100)}%</div></div>`;}
function pickQs(mode,subj){if(mode==='weak')return shuffle(weakQs(subj)).slice(0,15);return shuffle(ableQs(subj)).slice(0,15);}

  // 3. LEVEL + STATS

  <div class="ov-grid"><div class="card"><div class="ov-label">Đã thuộc</div><div class="ov-value" style="color:var(--good)">${tM}<span style="color:var(--ink-mute);font-size:.45em">/${tQ}</span></div></div><div class="card"><div class="ov-label">Chính xác</div><div class="ov-value">${tA?fPct(tC/tA):'—'}</div></div><div class="card"><div class="ov-label">Chuỗi ngày</div><div class="ov-value" style="color:#e67e00">${g.dailyChain||0} 🔥</div></div></div>

// === QUIZ ===
function startQuiz(mode,subj,hwSesIdx,hwQs){
  const qs=hwQs||pickQs(mode,subj);if(qs.length===0){alert("Không có câu phù hợp.");return;}
  const isTest=mode==='test';
  state.session={mode,subject:subj,questions:qs,idx:0,selected:null,revealed:false,answers:[],startTs:Date.now(),qStart:Date.now(),isTest,timeLeft:isTest?3600:null,timer:null,streak:0,comebackActive:false,_lastXP:0,_lastStreak:0,_lastComeback:false,xpBefore:state.progress.gamification.xp,xpGained:0,hwSessionIdx:hwSesIdx!=null?hwSesIdx:undefined};
  if(isTest){state.session.timer=setInterval(()=>{state.session.timeLeft-=1;const el=document.getElementById("timer-d");if(el)el.textContent=Math.floor(state.session.timeLeft/60)+':'+String(state.session.timeLeft%60).padStart(2,'0');if(state.session.timeLeft<=0){clearInterval(state.session.timer);finishQuiz();}},1000);}
  updateDaily();saveSession();go({name:"quiz"});
}

function renderQuiz(){
  const s=state.session,info=SUBJECTS[s.subject],q=s.questions[s.idx],pct=(s.idx+(s.revealed?1:0))/s.questions.length;
  const qStat=state.progress.qStats[q.id],isTrap=qStat&&qStat.wrong>0&&qStat.seen>=2;
  const opts=q.o.map(o=>{const[L,T,N]=o;let cls="opt";if(s.revealed){if(L===q.c)cls+=" correct";else if(L===s.selected)cls+=" wrong";else cls+=" dim";}else if(s.selected===L)cls+=" selected";const mk=s.revealed?(L===q.c?"✓":(L===s.selected&&L!==q.c?"✕":"")):"";return`<button class="${cls}" data-action="pick" data-letter="${L}" ${s.revealed?"disabled":""}><div class="opt-key">${L}</div><div class="opt-text">${esc(T)}${N?`<div class="opt-note">(${esc(N)})</div>`:''}</div>${mk?`<div class="opt-mark">${mk}</div>`:''}</button>`;}).join('');
  const hwLabel=s.hwSessionIdx!=null?` · Phiên ${s.hwSessionIdx+1}`:'';
  return`<div class="quiz-header"><button class="quiz-close" data-action="exit-quiz">✕</button><div class="quiz-progress"><div class="quiz-pbar" style="width:${pct*100}%"></div></div>${s.isTest?`<div style="font-weight:700;font-size:.9rem;color:${s.timeLeft<120?'var(--warn)':'var(--ink-soft)'}" id="timer-d">${Math.floor(s.timeLeft/60)}:${String(s.timeLeft%60).padStart(2,'0')}</div>`:''}<div class="quiz-counter"><strong>${s.idx+1}</strong>/${s.questions.length}${hwLabel}</div></div>
<div class="quiz-level-row">
  <span class="qlr-badge" id="qlr-b"></span>
  <div class="qlr-bar"><div class="qlr-bar-fill" id="qlr-f"></div></div>
  <span class="qlr-xp" id="qlr-x"></span>
</div>
<div class="quiz-body"><div class="q-meta"><span class="q-pill q-pill-id">Đề ${q.e} · Câu ${q.eq}</span>${isTrap?'<span class="q-pill q-pill-trap">⚠ Câu bẫy</span>':''}${s.streak>1?`<span class="q-pill q-pill-streak">🔥 ${s.streak}</span>`:''}</div><div class="q-text">${esc(q.q)}</div>${q.imgSrc?`<img class="q-image" src="${q.imgSrc}" alt="Hình">`:''}${q.img?`<div class="q-img-desc">📷 ${esc(q.img)}</div>`:''}<a class="q-search" href="${imgSearchUrl(q)}" target="_blank" rel="noopener">🔍 Google</a><div class="opts">${opts}</div></div>`;
}

function selectOpt(L){const s=state.session;if(!s||s.revealed)return;s.selected=L;render();}
function confirmAnswer(){
  const s=state.session;if(!s||s.revealed||!s.selected)return;
  const q=s.questions[s.idx],ok=s.selected===q.c,ms=Date.now()-s.qStart;
  s.answers.push({qId:q.id,selected:s.selected,correct:ok,timeMs:ms,q});
  if(q.c)recordAnswer(q.id,ok,ms);
  let xp=0;s._lastComeback=false;
  if(ok){s.streak+=1;xp=10+Math.min(s.streak*2,20);const qs=state.progress.qStats[q.id];if(qs&&qs.wrong>1)xp+=15;if(s.comebackActive){xp+=5;s._lastComeback=true;showCombo('🔄 Comeback!','var(--brand)');}s.comebackActive=false;addXP(xp);s.xpGained+=xp;const g=state.progress.gamification;g.globalStreak=s.streak;if(s.streak>g.bestStreak)g.bestStreak=s.streak;saveP();setTimeout(()=>showXPFloat(xp),200);if(Math.random()<.15)setTimeout(()=>showToast('🎁 '+FACTS[Math.floor(Math.random()*FACTS.length)]),800);if([5,10,15,20].includes(s.streak))setTimeout(()=>showCombo('🔥 Streak '+s.streak+'!','#e67e00'),400);}
  else{s.streak=0;s.comebackActive=true;xp=-3;const penalty=3;state.progress.gamification.xp=Math.max(0,state.progress.gamification.xp-penalty);s.xpGained-=penalty;saveP();setTimeout(()=>{const e=document.createElement('div');e.className='xp-float negative';e.textContent='-'+penalty+' XP';e.style.right='20px';e.style.top='60px';document.body.appendChild(e);setTimeout(()=>e.remove(),1400);},200);}
  s._lastXP=xp;s._lastStreak=s.streak;s.revealed=true;saveSession();render();
}
function pickTest(L){const s=state.session;if(s.revealed)return;s.selected=L;const q=s.questions[s.idx],ok=L===q.c,ms=Date.now()-s.qStart;s.answers.push({qId:q.id,selected:L,correct:ok,timeMs:ms,q});if(q.c)recordAnswer(q.id,ok,ms);saveSession();setTimeout(()=>nextQuestion(),200);}
function nextQuestion(){const s=state.session;if(s.idx===s.questions.length-1){finishQuiz();return;}s.idx+=1;s.selected=null;s.revealed=false;s.qStart=Date.now();s._lastXP=0;s._lastStreak=0;s._lastComeback=false;saveSession();render();}

function finishQuiz(){
  const s=state.session;if(s.timer)clearInterval(s.timer);
  const cor=s.answers.filter(a=>a.correct).length;
  const lvlBefore=getLevel(s.xpBefore);
  const ses={ts:Date.now(),subject:s.subject,mode:s.mode,total:s.answers.length,correct:cor,durationMs:Date.now()-s.startTs,answers:s.answers,xpGained:s.xpGained,xpBefore:s.xpBefore,hwSessionIdx:s.hwSessionIdx};
  if(cor===ses.total&&ses.total>=5){addXP(50);ses.xpGained+=50;ses.perfectBonus=true;setTimeout(showConfetti,300);}
  const lvlAfter=getLevel(state.progress.gamification.xp);
  ses.leveledUp=lvlAfter.xp>lvlBefore.xp;ses.newLevel=lvlAfter;
  if(ses.leveledUp)setTimeout(showConfetti,500);
  recordSession(ses);
  // Save homework session result
  if(s.hwSessionIdx!=null&&state.progress.homework){

="quiz-pbar" style="width:${b.streak/b.target*100}%"></div></div><div class="quiz-counter" style="color:${info.color}">${info.icon} Boss</div></div>
<div class="quiz-level-row"><span class="qlr-badge" id="qlr-b"></span><div class="qlr-bar"><div class="qlr-bar-fill" id="qlr-f"></div></div><span class="qlr-xp" id="qlr-x"></span></div><div class="quiz-body"><div class="boss-stage"><div class="boss-num" style="color:${info.color}">${b.streak}<span style="font-size:.35em;color:var(--ink-mute)">/${b.target}</span></div><div class="boss-label">streak</div><div class="boss-hearts">${hearts}</div></div><div class="q-meta"><span class="q-pill q-pill-id">Đề ${q.e} · Câu ${q.eq}</span></div><div class="q-text">${esc(q.q)}</div>${q.imgSrc?`<img class="q-image" src="${q.imgSrc}">`:''}${q.img?`<div class="q-img-desc">📷 ${esc(q.img)}</div>`:''}<div class="opts">${opts}</div></div>`;}
function selectBoss(L){const b=state.boss;if(!b||b.revealed)return;b.selected=L;render();}
function confirmBoss(){const b=state.boss;if(!b||b.revealed||!b.selected)return;b.revealed=true;const q=b.questions[b.idx],ok=b.selected===q.c,ms=Date.now()-b.qStart;if(q.c)recordAnswer(q.id,ok,ms);if(ok){b.streak+=1;if(b.streak>b.bestStreak)b.bestStreak=b.streak;if(b.streak>=b.target){b.finished=true;b.won=true;}const xp=addXP(10+b.streak*2);b.xpGained+=xp;setTimeout(()=>showXPFloat(xp),200);}else{b.streak=0;b.lives-=1;if(b.lives<=0){b.finished=true;b.won=false;}const penalty=3;state.progress.gamification.xp=Math.max(0,state.progress.gamification.xp-penalty);b.xpGained-=penalty;saveP();setTimeout(()=>{const e=document.createElement('div');e.className='xp-float negative';e.textContent='-'+penalty+' XP';e.style.right='20px';e.style.top='60px';document.body.appendChild(e);setTimeout(()=>e.remove(),1400);},200);}saveSession();render();}

function fcRate(r){const fc=state.fcSession,card=fc.cards[fc.idx],cur=state.progress.fcStats[card.id]||{ease:2.5,interval:0};const ri=parseInt(r);if(ri>=2){cur.ease=Math.min(3,cur.ease+.05);cur.interval=cur.interval===0?1:Math.round(cur.interval*cur.ease);}else{cur.ease=Math.max(1.3,cur.ease-.2);cur.interval=.25;}cur.dueAt=Date.now()+cur.interval*DAY;state.progress.fcStats[card.id]=cur;saveP();if(fc.idx<fc.cards.length-1){fc.idx++;fc.side='front';render();}else go({name:"flashcard-home"});}

function bindEvents(){
  document.querySelectorAll("[data-action]").forEach(el=>{el.addEventListener("click",e=>{
    const a=el.getAttribute("data-action"),subj=el.getAttribute("data-subject"),mode=el.getAttribute("data-mode");
    if(a==="subject")go({name:"subject",subject:subj});
    else if(a==="start-quiz")startQuiz(mode,subj);
    else if(a==="start-hw-ses"){const idx=parseInt(el.getAttribute("data-ses"));startHomeworkSession(idx);}
    else if(a==="start-srs"){const due=shuffle(dueQs(null)).slice(0,20);if(due.length)startQuiz('practice',due[0].s,undefined,due);else alert('Không có câu đến hạn.');}
    else if(a==="start-exam"){const qs=shuffle(ableQs(null)).slice(0,60);if(qs.length)startQuiz('test',qs[0].s,undefined,qs);else alert('Không đủ câu.');}
    else if(a==="export-hw-text")exportHwReport();
else if(a==="export-hw")exportHwAsImage();
    else if(a==="export-result-text"){const ses2=state.view.session;if(ses2)exportResult(ses2);}
else if(a==="export-result"){const ses=state.view.session;if(ses)exportResultAsImage(ses);}
    else if(a==="boss-config"){state.bossTarget=5;go({name:"boss-config",subject:subj});}
    else if(a==="boss-target"){state.bossTarget=parseInt(el.getAttribute("data-n"));render();}
    else if(a==="boss-start")startBoss(subj);
    else if(a==="boss-pick")selectBoss(el.getAttribute("data-letter"));
    else if(a==="exit-boss"){if(confirm("Thoát Boss Mode?")){clearSession();state.boss=null;go({name:"home"});}}
    else if(a==="dismiss-boss")go({name:"subject",subject:state.view.subject});
    else if(a==="pick"){if(state.session?.isTest)pickTest(el.getAttribute("data-letter"));else selectOpt(el.getAttribute("data-letter"));}
    else if(a==="exit-quiz"){if(confirm("Thoát?")){if(state.session?.timer)clearInterval(state.session.timer);clearSession();state.session=null;go({name:"home"});}}
    else if(a==="weak")go({name:"weak"});
    else if(a==="stats")go({name:"stats"});
    else if(a==="flashcard")go({name:"flashcard-home"});
    else if(a==="fc-topic")startFC(el.getAttribute("data-topic"));
    else if(a==="fc-flip")fcFlip();
    else if(a==="fc-dir"){state.fcSession.direction=state.fcSession.direction==='en2vi'?'vi2en':'en2vi';state.fcSession.side='front';render();}
    else if(a==="fc-rate")fcRate(el.getAttribute("data-rating"));
    else if(a==="home")go({name:"home"});
    else if(a==="reset"){if(confirm("Xoá toàn bộ dữ liệu?")){localStorage.removeItem(SK);localStorage.removeItem(SSK);state.progress={v:2,qStats:{},fcStats:{},history:[],gamification:defGam(),homework:null};go({name:"home"});}}
    else if(a==="resume"){const sv=getSaved();if(sv)resumeSession(sv);else go({name:"home"});}
    else if(a==="discard-session"){clearSession();render();}
  });});
}


// === EXPORT AS IMAGE (Phase 3) ===
function buildReportHTML(title, date, correct, total, durationMin, xpGained, wrongList) {
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const scoreColor = pct >= 70 ? '#0d8a4d' : pct >= 50 ? '#e6a800' : '#d9534f';
  let wrongsHtml = '';
  if (wrongList.length > 0) {
    wrongsHtml = '<div class="rpt-section"><div class="rpt-section-title">\u274c C\u00e2u sai (' + wrongList.length + ')</div>';
    wrongList.forEach(function(w, i) {
      wrongsHtml += '<div class="rpt-wrong"><div class="rpt-wrong-q">' + (i+1) + '. [\u0110\u1ec1 ' + (w.e||'?') + ' C\u00e2u ' + (w.eq||'?') + '] ' + esc((w.q||'').slice(0,70)) + ((w.q||'').length>70?'\u2026':'') + '</div><div class="rpt-wrong-ans">Ch\u1ecdn: ' + w.selected + '</div><div class="rpt-wrong-cor">\u0110\u00e1p \u00e1n: ' + w.correct + (w.correctText ? ' (' + esc(w.correctText) + ')' : '') + '</div></div>';
    });
    wrongsHtml += '</div>';
  }
  return '<div class="rpt"><div class="rpt-head"><div class="rpt-brand">\u00d4n thi l\u1edbp 6 CLC</div><div class="rpt-date">' + title + '</div><div style="font-size:.85rem;color:#5b6677">' + date + '</div></div><div class="rpt-score-box"><div class="rpt-score-num" style="color:' + scoreColor + '">' + correct + '/' + total + '</div><div class="rpt-score-pct">' + pct + '% ch\u00ednh x\u00e1c</div><div class="rpt-score-meta">\u23f1 ' + durationMin + ' ph\u00fat' + (xpGained ? ' \u00b7 +' + xpGained + ' XP' : '') + '</div></div>' + wrongsHtml + '<div class="rpt-footer">\u00d4n thi l\u1edbp 6 CLC \u00b7 ' + date + '</div></div>';
}

async function captureAndShare(htmlContent) {
  // Show loading
  const loading = document.createElement('div');
  loading.className = 'export-loading';
  loading.innerHTML = '<div class="export-loading-box">\ud83d\udcf8 \u0110ang t\u1ea1o \u1ea3nh...</div>';
  document.body.appendChild(loading);
  
  try {
    // Create hidden container
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;top:-9999px;left:0;z-index:-1;';
    container.innerHTML = htmlContent;
    document.body.appendChild(container);
    const target = container.firstElementChild;
    
    // Add the report styles inline for html2canvas
    const styleEl = document.createElement('style');
    styleEl.textContent = document.querySelector('style').textContent;
    container.prepend(styleEl);
    
    // Capture
    if (typeof html2canvas === 'undefined') {
      throw new Error('html2canvas not loaded');
    }
    const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
    container.remove();
    
    // Convert to blob
    const blob = await new Promise(function(resolve) { canvas.toBlob(resolve, 'image/png'); });
    const file = new File([blob], 'bao-cao-on-tap.png', { type: 'image/png' });
    
    loading.remove();
    
    // Try sharing
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'B\u00e1o c\u00e1o \u00f4n t\u1eadp' });
    } else {
      // Download fallback
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bao-cao-on-tap.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('\u2705 \u0110\u00e3 t\u1ea3i \u1ea3nh xu\u1ed1ng!', '#1a2330');
    }
  } catch (err) {
    loading.remove();
    console.error('Export failed:', err);
    // Fallback to text export
    showToast('\u26a0 Kh\u00f4ng t\u1ea1o \u01b0\u1ee3c \u1ea3nh, chuy\u1ec3n sang text...', '#e6a800');
  }
}

function exportResultAsImage(ses) {
  const info = SUBJECTS[ses.subject] || { label: 'Mix' };
  const wrongs = ses.answers.filter(function(a) { return !a.correct; }).map(function(a) {
    const q = a.q || QUESTIONS.find(function(x) { return x.id === a.qId; }) || {};
    const co = q.o ? q.o.find(function(o) { return o[0] === q.c; }) : null;
    return { e: q.e, eq: q.eq, q: q.q, selected: a.selected, correct: q.c, correctText: co ? co[1] : '' };
  });
  const h = buildReportHTML(
    info.label,
    todayLabel(),
    ses.correct, ses.total,
    (ses.durationMs / 60000).toFixed(1),
    ses.xpGained || 0,
    wrongs
  );
  captureAndShare(h).catch(function() { exportResult(ses); });
}

function exportHwAsImage() {
  const hw = state.progress.homework;
  if (!hw) return;
  const t = hwTotalDone(hw);
  let allWrongs = [];
  let totalDur = 0;
  let totalXP = 0;
  hw.sessions.forEach(function(s) {
    if (s.completed && s.result) {
      totalDur += s.result.durationMs || 0;
      totalXP += s.result.xpGained || 0;
      (s.result.answers || []).filter(function(a) { return !a.correct; }).forEach(function(a) {
        const q = QUESTIONS.find(function(x) { return x.id === a.qId; }) || {};
        const co = q.o ? q.o.find(function(o) { return o[0] === q.c; }) : null;
        allWrongs.push({ e: q.e, eq: q.eq, q: q.q, selected: a.selected, correct: q.c, correctText: co ? co[1] : '' });
      });
    }
  });
  const h = buildReportHTML(
    'B\u00e0i t\u1eadp v\u1ec1 nh\u00e0',
    hw.dateLabel || hw.date,
    t.correct, t.done,
    (totalDur / 60000).toFixed(1),
    totalXP,
    allWrongs
  );
  captureAndShare(h).catch(function() { exportHwReport(); });
}
